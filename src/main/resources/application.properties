spring.application.name=catalogo-producto

# 1. Servidor Web
server.port=8083

# 2. Conexion a MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/catalogo_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=admin
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 3. JPA / Hibernate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Configuracion de Conexion a Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Definir Redis como el proveedor oficial de cache
spring.cache.type=redis

# Tiempo de vida por defecto de las claves en cache (10 minutos = 600000 ms)
spring.cache.redis.time-to-live=600000

# Evitar guardar valores nulos en la cache
spring.cache.redis.cache-null-values=false